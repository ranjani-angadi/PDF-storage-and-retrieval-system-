<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Digital Library</h1>

<a href="/upload">Upload Book</a>

<form action="/search">

    <input type="text"
           name="keyword"
           placeholder="Search Books">

    <button>Search</button>

</form>

<table>

<tr>
    <th>ID</th>
    <th>Title</th>
    <th>Author</th>
    <th>Category</th>
    <th>Download</th>
</tr>

{% for book in books %}
<tr>

<td>{{ book[0] }}</td>
<td>{{ book[1] }}</td>
<td>{{ book[2] }}</td>
<td>{{ book[3] }}</td>

<td>
<a href="/download/{{ book[4] }}">
Download
</a>
</td>

</tr>
{% endfor %}

</table>

</body>
</html>
